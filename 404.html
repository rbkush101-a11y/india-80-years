<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>404 — IN INDIA 80</title>

    <meta
        name="description"
        content="The requested page could not be found."
    >

    <link
        rel="icon"
        type="image/png"
        href="favicon.png"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="error-page">

    <div class="error-glow"></div>

    <main class="error-content">

        <div class="error-chakra">
            ☸
        </div>

        <p class="error-label">
            SIGNAL LOST
        </p>

        <h1>
            404
        </h1>

        <h2>
            PATH NOT FOUND
        </h2>

        <p class="error-message">
            This path doesn't exist,
            but India's journey continues.
        </p>

        <a
            href="/"
            class="error-button">
            🇮🇳 BACK TO INDIA
        </a>

        <p class="error-code">
            ERROR::ROUTE_NOT_FOUND
        </p>

    </main>

</body>

</html>
